name: ci

# `on: [push, pull_request]` fires twice for every branch that has an open PR — once for
# each event — so every push ran the whole matrix twice. Restricting push to the default
# branch keeps main covered while PR branches are validated exactly once.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. Nothing in this workflow writes to the repository —
# it installs, builds, tests and reads files — so read access to contents is all it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Without this a hung step runs to the 6-hour default and, worse, GitHub serves no
    # logs for an in-progress job — so the failure is both expensive and invisible.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Mirrors package.json engines, which mirrors re2's own requirement. Node 20 is
        # absent because it reached EOL on 2026-04-30 and re2 >= 1.25.1 does not support
        # it. The RE2 binding is ABI-bound to the Node major it was built against, and the
        # engine gate below is what turns a silent fallback on a new major into a red build.
        node-version: ["22.22.2", "24.15.0", "24"]
    name: test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node-version }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
        # Scope audit to production deps only — excludes vitest/vite (dev-only, never shipped).
        # No advisories are allowlisted: any high/critical in the runtime graph fails the gate.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm build

      # re2 is a native addon and the test runner loads it inside worker threads. An
      # addon that is not context-aware can deadlock on load in a worker rather than
      # fail, which surfaces as a test run that never finishes and never prints. Probing
      # both contexts separately turns that into a named failure with a log.
      - name: probe re2 loads in the main thread and in a worker
        timeout-minutes: 2
        run: |
          node -e "
            const re2 = require('re2');
            console.log('main thread: re2 ok ->', new re2('abc','i').test('xxABCxx'));
          "
          node -e "
            const { Worker } = require('node:worker_threads');
            const w = new Worker(\"const re2=require('re2');require('node:worker_threads').parentPort.postMessage(new re2('abc','i').test('xxABCxx'))\", { eval: true });
            const timer = setTimeout(() => { console.error('worker thread: re2 load TIMED OUT'); process.exit(1); }, 60000);
            w.on('message', m => { clearTimeout(timer); console.log('worker thread: re2 ok ->', m); w.terminate(); });
            w.on('error', e => { clearTimeout(timer); console.error('worker thread: re2 failed ->', e.message); process.exit(1); });
          "

      # Verbose so the log names the last file reached: a run that stops mid-suite is
      # diagnosable, where the default summary reporter prints nothing until the end.
      - run: pnpm test -- --reporter=verbose

      # The tool advertises linear-time, ReDoS-immune matching via RE2, and degrades to
      # a backtracking JS engine when the native binding cannot load. That fallback is
      # deliberately non-fatal at runtime, which means CI is the only place it can be
      # caught — without this step a Node upgrade would quietly ship a weaker guarantee
      # while every other check stayed green.
      - name: assert RE2 is the active engine
        run: node dist/cli.js analyze src/core/__fixtures__/benign --require-re2 > /dev/null

      # Pipelines gate on these numbers, so they are part of the public contract and a
      # silent change to any of them would break a caller without failing a test.
      # 3 = threshold met, 0 = clean, 4 = clean-but-truncated, 2 = RE2 demanded and absent.
      - name: assert the --fail-on exit-code contract
        run: |
          set +e
          check() {
            node dist/cli.js analyze "$1" ${@:3} > /dev/null 2>&1
            local got=$?
            if [ "$got" != "$2" ]; then
              echo "FAIL: analyze $1 ${@:3} -> exit $got, expected $2"
              exit 1
            fi
            echo "  ok: analyze $(basename $1) ${@:3} -> $got"
          }
          check src/core/__fixtures__/abuse  3 --fail-on LIKELY_ABUSE
          check src/core/__fixtures__/abuse  3 --fail-on SUSPICIOUS
          check src/core/__fixtures__/benign 0 --fail-on LIKELY_ABUSE
          check src/core/__fixtures__/benign 3 --fail-on BENIGN_SCANNER
          check src/core/__fixtures__/benign 4 --fail-on LIKELY_ABUSE --max-rows 2
          check src/core/__fixtures__/benign 1 --fail-on NOPE
          # Input forms: one CSV is a valid target; the two ways to name logs are exclusive.
          check src/core/__fixtures__/benign/Sites-2024-01-15.csv 0
          check src/core/__fixtures__/benign 1 --org 00D000000000001EAA

      # `doctor` is the pre-flight an operator is told to trust, so a green build must
      # mean it actually reports this installation as healthy. It shares exit code 2 with
      # --require-re2: one number for "cannot stand behind its own guarantees".
      - name: assert doctor reports a healthy install
        run: |
          node dist/cli.js doctor
          node -e "
            const { execFileSync } = require('node:child_process');
            const d = JSON.parse(execFileSync('node', ['dist/cli.js', 'doctor', '--json'], { encoding: 'utf8' }));
            if (d.status !== 'ok') { console.error('doctor: ' + JSON.stringify(d)); process.exit(1); }
            if (d.engine.name !== 're2') { console.error('doctor: engine is ' + d.engine.name); process.exit(1); }
            console.log('  ok: doctor -> ok on ' + d.node.version);
          "

      # The machine-readable modes are a published interface: agents and scripts parse
      # them, so malformed or reshaped output is a breaking change, not a cosmetic one.
      - name: assert the machine-readable modes emit valid JSON
        run: |
          node -e "
            const { execFileSync } = require('node:child_process');
            const run = (...a) => JSON.parse(execFileSync('node', ['dist/cli.js', ...a], { encoding: 'utf8' }));
            const cat = run('catalog', '--json');
            if (!cat.count || cat.count !== cat.rules.length) throw new Error('catalog --json: count/rules mismatch');
            if (!cat.rules.every(r => typeof r.sfExploitable === 'boolean')) throw new Error('catalog --json: rule shape');
            const ex = run('explain', '--json');
            if (ex.verdicts.length !== 3) throw new Error('explain --json: expected 3 verdicts');
            if (ex.verdicts.map(v => v.severity).join() !== '0,1,2') throw new Error('explain --json: severity order');
            const an = run('analyze', 'src/core/__fixtures__/abuse', '--json');
            for (const k of ['engine', 'truncated', 'limitsReached', 'stats', 'verdicts'])
              if (!(k in an)) throw new Error('analyze --json: missing ' + k);
            for (const k of ['reasons', 'allResponsesErrorOrCanned', 'distinctUrisTruncated'])
              if (!(k in an.verdicts[0])) throw new Error('analyze --json: verdict missing ' + k);
            console.log('  ok: catalog/explain/analyze --json shapes hold');
          "
          set +e
          node dist/cli.js explain NOPE > /dev/null 2>&1
          [ $? = 1 ] || { echo 'FAIL: explain NOPE should exit 1'; exit 1; }
          echo '  ok: explain NOPE -> 1'

  lint-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: docs match the shipped surface
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # SECURITY.md previously described an audit allowlist that had already been removed
      # from package.json. Documentation drift on a security control is a security bug:
      # it is what an auditor reads instead of the config.
      - name: SECURITY.md does not claim an audit allowlist unless one exists
        run: |
          if grep -q 'ignoreGhsas' docs/SECURITY.md && ! grep -q 'ignoreGhsas' package.json; then
            echo "SECURITY.md documents an audit allowlist that package.json does not define"
            exit 1
          fi
